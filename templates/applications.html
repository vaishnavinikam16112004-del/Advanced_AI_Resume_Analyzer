{% extends 'base.html' %}{% block content %}<h1>Job application tracker</h1><form method="post" class="panel formgrid"><div><label>Company</label><input name="company" required></div><div><label>Role</label><input name="role" required></div><div><label>Status</label><select name="status"><option>Applied</option><option>Shortlisted</option><option>Interview</option><option>Rejected</option><option>Offer</option></select></div><div><label>Applied date</label><input type="date" name="applied_date"></div><div><label>Notes</label><input name="notes"></div><button class="btn">Save application</button></form><section class="panel"><h2>Your applications</h2>{% for r in rows %}<p><b>{{r.role}}</b> — {{r.company}} | {{r.status}} <small>{{r.applied_date}} · {{r.notes}}</small><form method="post" action="/application/delete/{{r.id}}"><button class="delete">Delete</button></form></p>{% else %}<p>No applications saved.</p>{% endfor %}</section>{% endblock %}
